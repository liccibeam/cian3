<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Найдите своё место · Циан</title>
<link rel="stylesheet" href="brand/brand.css"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="film.css">
</head>
<body>
<div id="frame">
<div id="stage" class="layer"><div id="app">
  <div class="disc" id="disc"></div>
  <img class="brand" id="brand" src="brand/logos/wordmark.svg" alt="Циан">
  <div class="eyebrow" id="eyebrow">МОБИЛЬНАЯ ГЛАВНАЯ</div>
  <section class="copy" id="copy0"><h1><span>Не начинайте</span><span class="blue">поиск заново</span></h1><p>Вернитесь к тому, что искали.</p></section>
  <section class="copy" id="copy1"><h1><span>Ваш поиск —</span><span class="blue">под рукой</span></h1><p>2-комнатные · Сокольники<br>До 20 млн ₽</p></section>
  <section class="copy" id="copy2"><h1><span>Перейдите</span><span>к выбору</span><span class="blue">квартиры</span></h1></section>
  <section class="copy final" id="copy3"><h1><span>Найдите</span><span class="blue">своё место</span></h1><div class="final-cta">Начните с главной<svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div></section>
  <div class="chapter" id="chapter"><span id="chapter-num">01</span><span class="line"></span><span id="chapter-name">Сохранённый поиск</span></div>
  <div class="progress"><i><b id="p0"></b></i><i><b id="p1"></b></i><i><b id="p2"></b></i><i><b id="p3"></b></i></div>
  <div id="device"><div id="screen">
    <div id="page-home" class="screen-page"><img id="img-home" class="capture" src="assets/home.png" alt="Реальная мобильная главная"><img class="nav" src="assets/home-nav.png" alt=""></div>
    <div id="page-search" class="screen-page"><img id="img-search" class="capture" src="assets/search.png" alt="Реальная выдача"><img class="nav" src="assets/search-nav.png" alt=""></div>
    <div id="page-detail" class="screen-page"><img id="img-detail" class="capture" src="assets/detail.png" alt="Реальная карточка квартиры"><img class="nav" src="assets/detail-nav.png" alt=""></div>
    <div id="focus"></div><div id="pulse"></div><div id="touch"></div>
  </div></div>
</div></div>
<div id="stage2" class="layer"><div id="app2"></div></div>
</div>
<script src="plan.js"></script><script src="assets/capture.js"></script><script src="cues.js"></script><script src="tmap.js"></script><script src="engine.js"></script><script src="scene.js"></script>
</body></html>
